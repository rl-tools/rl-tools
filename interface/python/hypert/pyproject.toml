[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypert"
version = "0.1.0"
description = "Hyper Ray Tracer: Python interface to the RLtools raytracing renderer"
requires-python = ">=3.9"
dependencies = ["numpy", "nanobind>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["hypert"]
