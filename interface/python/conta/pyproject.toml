[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conta"
version = "0.0.1"
description = "Content Addressed Blob Storage"
readme = "README.md"
authors = [{name = "Jonas Eschmann", email = "jonas.eschmann@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["conta"]

[project.scripts]
conta = "conta:main"
