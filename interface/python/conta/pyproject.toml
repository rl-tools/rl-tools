[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conta"
version = "0.0.6"
description = "Content Addressed Blob Storage"
readme = "README.md"
authors = [{name = "Jonas Eschmann", email = "jonas.eschmann@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[tool.hatch.build.targets.wheel]
only-include = ["conta/__init__.py", "conta/index.py"]

[tool.hatch.build.targets.sdist]
only-include = ["conta/__init__.py", "conta/index.py", "tests/test_conta.py", "tests/test_index.py", "README.md", "pyproject.toml"]

[project.scripts]
conta = "conta:main"
