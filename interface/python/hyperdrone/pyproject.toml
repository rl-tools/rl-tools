[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperdrone"
version = "0.1.7"
authors = [{name = "Jonas Eschmann", email = "jonas.eschmann@gmail.com"}]
license = {text = "MIT"}
description = "The fastest drone simulator and renderer (raytracer)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "nanobind>=2.0", "conta"]

[project.optional-dependencies]
examples = ["scipy>=1.15", "matplotlib", "imageio", "imageio-ffmpeg"]
gym = ["gymnasium>=1.0"]

[tool.hatch.build]
exclude = [
    "*.mp4", "*.gif",
    "*.o", "*.obj", "*.a", "*.lib",
    "*.so", "*.so.*", "*.dylib", "*.dll", "*.pyd",
    "__pycache__/", ".build*/", "build/", "build-*/", "cmake-build-*/",
    "CMakeFiles/", "CMakeCache.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["hyperdrone"]

[tool.hatch.build.targets.sdist]
only-include = ["hyperdrone", "hatch_build.py", "README.md", "pyproject.toml"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
