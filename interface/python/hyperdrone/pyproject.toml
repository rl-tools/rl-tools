[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyperdrone"
dynamic = ["version"]
authors = [{name = "Jonas Eschmann", email = "jonas.eschmann@gmail.com"}]
license = {text = "MIT"}
description = "The fastest drone simulator: L2F multirotor dynamics and RL environments on the HyperLux raytracer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "nanobind>=2.0", "conta>=0.0.1", "hyperlux==0.1.8"]

[project.optional-dependencies]
examples = ["scipy>=1.15", "matplotlib", "imageio", "imageio-ffmpeg"]
gym = ["gymnasium>=1.0"]

[tool.hatch.build]
exclude = [
    "*.mp4", "*.gif",
    "*.o", "*.obj", "*.a", "*.lib",
    "*.so", "*.so.*", "*.dylib", "*.dll", "*.pyd",
    "__pycache__/", ".build*/", "build/", "build-*/", "cmake-build-*/",
    "CMakeFiles/", "CMakeCache.txt",
]

[tool.hatch.version]
path = "hyperdrone/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["hyperdrone"]

[tool.hatch.build.targets.sdist]
only-include = ["hyperdrone", "README.md", "pyproject.toml"]
