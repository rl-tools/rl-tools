[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metra"
version = "0.0.1"
description = "Client for the minimal metrics tracking server (tools/metra/www) for regression monitoring."
readme = "README.md"
authors = [{name = "Jonas Eschmann", email = "jonas.eschmann@gmail.com"}]
license = {text = "MIT"}
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["metra"]

[project.scripts]
metra = "metra:main"
