# metra on a NAS (e.g. TrueNAS SCALE: Apps -> Discover Apps -> Custom App -> Install via YAML)
# Expects an RLtools checkout at <dataset>/rl_tools; adjust the two host paths below.
services:
  metra:
    image: python:3.12-alpine
    command: python3 /rl_tools/tools/metra/metra/server.py --ip 0.0.0.0 --port 13340
    environment:
      METRA_DB: /data/metra.sqlite
    volumes:
      - /mnt/tank/apps/metra/rl_tools:/rl_tools:ro
      - /mnt/tank/apps/metra/data:/data
    ports:
      - "13340:13340"
    user: "568:568" # TrueNAS apps convention; use an owner of the data dataset
    restart: unless-stopped
