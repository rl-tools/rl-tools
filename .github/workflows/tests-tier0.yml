# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: Tests Tier 0

on:
  workflow_dispatch:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, windows-latest, macos-14]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-24.04
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-24.04
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-22.04
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-22.04
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-14
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-24.04
            c_compiler: cl
          - os: ubuntu-22.04
            c_compiler: cl
          - os: macos-14
            c_compiler: cl
          - os: macos-14
            c_compiler: gcc

    steps:
      - uses: actions/checkout@v3

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Download Test Data
        shell: bash
        run: ./tests/download_data.sh
      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DRL_TOOLS_RL_ENVIRONMENTS_DISABLE_MUJOCO=ON
          -DRL_TOOLS_DISABLE_EXPERIMENTAL=ON
          -DRL_TOOLS_DISABLE_TAR=ON
          -S ${{ github.workspace }}

      - name: Build
        # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure --label-exclude '^procthor-golden$'

  hyperlux:
    name: HyperLux ${{ matrix.backend }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: generic
            cmake_backend: GENERIC
            benchmark_config: ""
            packages: git-lfs cmake
            backend_targets: test_hyperlux_overlay_scenarios_generic
          - backend: vulkan
            cmake_backend: VULKAN
            benchmark_config: -DRL_TOOLS_HYPERLUX_SIM_BENCHMARK_NUM_ENVS=16
            packages: libvulkan-dev glslang-tools mesa-vulkan-drivers git-lfs cmake python3-venv
            backend_targets: test_hyperlux_overlay_scenarios_vulkan test_hyperlux_golden_comparison_vulkan test_hyperlux_runtime_vulkan
          - backend: webgpu
            cmake_backend: WEBGPU
            benchmark_config: -DRL_TOOLS_HYPERLUX_SIM_BENCHMARK_NUM_ENVS=16
            packages: libvulkan1 mesa-vulkan-drivers cmake python3-venv
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "5"
      CTEST_PARALLEL_LEVEL: "5"

    steps:
      - uses: actions/checkout@v3

      - name: Install HyperLux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Download Test Data
        if: matrix.backend != 'webgpu'
        run: ./tests/download_data.sh

      - name: Create Python environment
        if: matrix.backend != 'generic'
        run: python3 -m venv .venv

      - name: Select Lavapipe driver
        if: matrix.backend != 'generic'
        run: |
          lavapipe_manifest="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$lavapipe_manifest"
          echo "VK_DRIVER_FILES=$lavapipe_manifest" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: >
          cmake -S . -B build-hyperlux-${{ matrix.backend }}
          -DCMAKE_BUILD_TYPE=Release
          -DRL_TOOLS_BACKEND_DISABLE_CUDA=ON
          -DRL_TOOLS_RL_ENVIRONMENTS_DISABLE_MUJOCO=ON
          -DRL_TOOLS_HYPERLUX_BACKEND=${{ matrix.cmake_backend }}
          -DRL_TOOLS_HYPERLUX_ENABLE_WASM_GOLDENS=${{ matrix.backend != 'webgpu' }}
          ${{ matrix.benchmark_config }}
          -DRL_TOOLS_REQUIRE_HYPERLUX_GOLDENS=${{ matrix.backend != 'webgpu' }}

      - name: Build HyperLux tests
        if: matrix.backend != 'webgpu'
        run: >
          cmake --build build-hyperlux-${{ matrix.backend }}
          --target
          test_hyperlux_golden_io
          test_hyperlux_golden_comparison_cpu
          test_hyperlux_golden_comparison_wasm
          hyperlux_golden_wasm
          conta
          ${{ matrix.backend_targets }}
          --parallel 5

      - name: Build render benchmarks
        if: matrix.backend != 'generic'
        run: >
          cmake --build build-hyperlux-${{ matrix.backend }} --parallel 5 --target
          hyperlux_sim_benchmark_medium
          hyperlux_sim_benchmark_high
          hyperlux_sim_benchmark_low
          hyperlux_sim_benchmark_very_high
          hyperlux_sim_benchmark_sweep
          hyperlux_procthor_frame_medium
          hyperlux_procthor_frame_high
          hyperlux_procthor_frame_low
          hyperlux_procthor_frame_very_high
          hyperlux_paper_benchmark
          test_hyperlux_paper_physics
          test_hyperlux_paper_physics_cpu

      - name: Test headless render benchmark contract
        if: matrix.backend != 'generic'
        run: env -u DISPLAY -u WAYLAND_DISPLAY .venv/bin/python tests/src/hyperlux/benchmark.py --build-dir build-hyperlux-${{ matrix.backend }} --backend ${{ matrix.backend }}

      - name: Test golden I/O
        if: matrix.backend != 'webgpu'
        working-directory: build-hyperlux-${{ matrix.backend }}
        run: ctest -L '^golden-io$' --no-tests=error --output-on-failure --timeout 20 -j5

      - name: Test overlay scenarios
        if: matrix.backend != 'webgpu'
        working-directory: build-hyperlux-${{ matrix.backend }}
        run: ctest -L '^overlay$' --no-tests=error --output-on-failure --timeout 20 -j5

      - name: Test paper physics contract and CPU driver
        if: matrix.backend != 'generic'
        working-directory: build-hyperlux-${{ matrix.backend }}
        run: ctest -L '^paper-benchmark$' --no-tests=error --output-on-failure --timeout 20 -j5

      - name: Test headless Vulkan runtime lifetime
        if: matrix.backend == 'vulkan'
        working-directory: build-hyperlux-${{ matrix.backend }}
        run: env -u DISPLAY -u WAYLAND_DISPLAY ctest -L '^hyperlux-runtime$' --no-tests=error --output-on-failure --timeout 60 -j1

      - name: Download pinned May paper scene
        if: matrix.backend != 'generic'
        run: >
          .venv/bin/python src/hyperlux/benchmark/download_paper_scene.py
          --destination build-hyperlux-${{ matrix.backend }}/paper-benchmark/ProcTHOR-Train-1.glb

      - name: Test headless paper benchmark contract
        if: matrix.backend != 'generic'
        run: >
          env -u DISPLAY -u WAYLAND_DISPLAY .venv/bin/python tests/src/hyperlux/paper_benchmark.py
          --build-dir build-hyperlux-${{ matrix.backend }} --backend ${{ matrix.backend }} --with-procthor --timeout 120

      # ProcTHOR corpus (tests/src/hyperlux/GOLDEN_LEDGER.md): the wasm reference
      # (bit-exact), generic CPU and lavapipe against their floors; OptiX comparisons require an OptiX host
      - name: Test ProcTHOR goldens
        if: matrix.backend != 'webgpu'
        working-directory: build-hyperlux-${{ matrix.backend }}
        run: ctest -L '^procthor-golden$' --no-tests=error --output-on-failure --timeout 300 -j5

      # the comparators write render-<backend>.png and diff-*.png next to the goldens
      - name: Upload golden renders and heatmaps
        if: always() && matrix.backend != 'webgpu'
        uses: actions/upload-artifact@v4
        with:
          name: hyperlux-golden-artifacts-${{ matrix.backend }}
          path: |
            tests/data/hyperlux/goldens/**/render-*.png
            tests/data/hyperlux/goldens/**/diff-*.png
          if-no-files-found: ignore
